<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ado-dad · Faster UI/UX Wireframe</title>
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --ink:#e8ebf0; --muted:#8b93a3; --line:#2a2f3a;
  --card:#1b212b; --skel:#222a36; --accent:#4f6bff; --accent2:#19c37d; --warn:#ffb020;
  --chip:#222a36; --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px;}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px}
.logo b{color:var(--accent)}
.tagline{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.layout{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.nav h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:var(--ink);padding:8px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;margin-bottom:3px}
.nav button:hover{background:var(--panel)}
.nav button.active{background:var(--accent);color:#fff;font-weight:600}
.stage{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
/* phone */
.phone{width:330px;flex:0 0 330px;background:#000;border-radius:38px;padding:11px;box-shadow:var(--shadow);
  border:1px solid #232838;position:sticky;top:18px}
.screen{background:var(--panel);border-radius:28px;height:680px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#000;border-radius:0 0 14px 14px;z-index:40}
.sbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;color:var(--muted);flex:0 0 auto}
.view{flex:1 1 auto;overflow-y:auto;scrollbar-width:thin}
.view::-webkit-scrollbar{width:5px}.view::-webkit-scrollbar-thumb{background:#2c3340;border-radius:4px}
/* generic ui atoms */
.appbar{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--panel);z-index:20;border-bottom:1px solid var(--line)}
.appbar .t{font-weight:700;font-size:15px}
.icn{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.search{flex:1;background:var(--card);border-radius:12px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:13px}
.pad{padding:14px}
.row{display:flex;gap:10px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:7px 12px;border-radius:20px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.icon{display:inline-flex;gap:6px;align-items:center}
.scrollx{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.scrollx::-webkit-scrollbar{height:0}
.muted{color:var(--muted)}
.h{font-weight:700;font-size:14px;margin:4px 0}
.sub{font-size:12px;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--skel) 25%,#2a3340 37%,var(--skel) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;width:100%;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.green{background:var(--accent2)}
.btn.row{display:flex;align-items:center;justify-content:center;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cat{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.cat .ic{width:60px;height:60px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.cat span{font-size:11px;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.adcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.adcard .img{height:96px;background:var(--skel);position:relative}
.adcard .fav{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:13px}
.adcard .b{padding:8px 9px}
.price{font-weight:800;font-size:14px}
.adcard .meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
.tag{position:absolute;top:7px;left:7px;background:var(--accent);color:#fff;font-size:9.5px;padding:3px 7px;border-radius:6px;font-weight:600}
.tab{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px 9px;flex:0 0 auto}
.tab .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);cursor:pointer;flex:1}
.tab .it.on{color:var(--accent)}
.tab .it .g{font-size:18px}
.fab{position:relative;margin-top:-26px}
.fab .b{width:54px;height:54px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.5);border:4px solid var(--panel)}
.sticky-cta{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:10px;flex:0 0 auto}
.hero{height:230px;background:var(--skel);position:relative}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff;width:16px;border-radius:4px}
.field{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.seg{display:flex;background:var(--card);border-radius:11px;padding:4px;gap:4px}
.seg div{flex:1;text-align:center;font-size:12px;padding:8px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg div.on{background:var(--accent);color:#fff}
.bubble{max-width:74%;padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.4}
.bubble.in{background:var(--card);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.out{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.av{width:42px;height:42px;border-radius:50%;background:var(--skel);flex:0 0 auto}
.list-it{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.badgeN{position:absolute;z-index:30;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#1a1205;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:default}
.notewrap{flex:1 1 300px;min-width:280px;max-width:430px}
.notewrap h3{font-size:15px;margin:2px 0 4px}
.scr-name{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.note{display:flex;gap:10px;margin:13px 0;font-size:13px;line-height:1.5}
.note .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--warn);color:#1a1205;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note b{color:var(--ink)}
.note span{color:var(--muted)}
.before{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.before b{color:var(--warn)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}
.kpi b{display:block;font-size:16px;color:var(--accent2)}
.hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{order:2}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
   <div class="logo">ado<b>·</b>dad</div>
   <div class="tagline">Faster UI/UX — interactive wireframe · v1 low-fidelity</div>
 </header>
 <div class="legend">
   <span><i class="dot" style="background:var(--accent)"></i> primary action / new pattern</span>
   <span><i class="dot" style="background:var(--warn)"></i> numbered = redesign note</span>
   <span><i class="dot" style="background:var(--skel)"></i> skeleton = perceived-speed loading</span>
   <span>Tap the bottom nav & cards inside the phone — it navigates.</span>
 </div>

 <div class="layout">
  <nav class="nav">
    <h4>Onboarding</h4>
    <button data-s="splash">1 · Splash / Onboarding</button>
    <button data-s="login">2 · Login (OTP)</button>
    <button data-s="otp">3 · OTP Verify</button>
    <button data-s="signup">4 · Sign up</button>
    <h4>Discover</h4>
    <button data-s="home" class="active">5 · Home</button>
    <button data-s="category">6 · Category list</button>
    <button data-s="search">7 · Search + Filters</button>
    <button data-s="detail">8 · Ad detail</button>
    <button data-s="seller">9 · Seller profile</button>
    <h4>Sell</h4>
    <button data-s="sellcat">10 · Sell — pick category</button>
    <button data-s="sellform">11 · Sell — form</button>
    <h4>Account</h4>
    <button data-s="profile">12 · Profile</button>
    <button data-s="myads">13 · My Ads / Wishlist</button>
    <button data-s="chat">14 · Chat</button>
    <button data-s="showroom">15 · Showroom</button>
  </nav>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="sbar"><span>9:41</span><span>5G &nbsp; 100%</span></div>
        <div id="view" class="view"></div>
        <div id="tabbar"></div>
      </div>
    </div>
    <div class="notewrap" id="notes"></div>
  </div>
 </div>
</div>

<script>
const A='var(--accent)';
function img(h){return `<div class="img skel" style="height:${h||96}px"></div>`}
function badge(top,left,n){return `<div class="badgeN" style="top:${top}px;left:${left}px" title="see note ${n}">${n}</div>`}

/* ---------- bottom tab bar ---------- */
function tabbar(active){
  const items=[['home','⌂','Home'],['search','⌕','Search'],['sell','＋','Sell'],['chat','💬','Chat'],['profile','◔','Profile']];
  return `<div class="tab">`+items.map(([s,g,l])=>{
    if(s==='sell') return `<div class="fab" onclick="go('sellcat')"><div class="b">＋</div></div>`;
    return `<div class="it ${active===s?'on':''}" onclick="go('${s}')"><div class="g">${g}</div>${l}</div>`;
  }).join('')+`</div>`;
}

/* ---------- ad card ---------- */
function adcard(tag){
  return `<div class="adcard" onclick="go('detail')">
    <div class="img skel">${tag?`<div class="tag">${tag}</div>`:''}<div class="fav">♡</div></div>
    <div class="b"><div class="price">₹ —</div>
      <div class="meta">Title placeholder<br>2021 · 32k km · Petrol<br>📍 Bengaluru · 2d ago</div></div>
  </div>`;
}

/* ================= SCREENS ================= */
const S={};

S.splash={tab:null,html:`
  <div style="height:100%;display:flex;flex-direction:column">
    <div class="hero" style="height:420px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff">
      ${badge(150,20,1)}🚗🏍️🏠
      <div class="dots"><i></i><i class="on"></i><i></i></div>
    </div>
    <div class="pad" style="text-align:center">
      <div class="h" style="font-size:19px">Buy & sell, near you</div>
      <div class="sub">Cars, bikes, commercial vehicles & property — in your city.</div>
    </div>
    <div style="flex:1"></div>
    <div class="pad">
      ${badge(0,0,2)}
      <button class="btn" onclick="go('login')">Continue with phone</button>
      <div style="height:10px"></div>
      <button class="btn ghost" onclick="go('home')">Skip · browse first</button>
    </div>
  </div>`,
  notes:['splash','Onboarding',[
   [1,'One swipeable value-prop screen','Collapses 4 separate splash routes into a single 3-dot carousel. Less code, instant first paint.'],
   [2,'“Browse first” escape hatch','Let users reach Home without an account. Login only when they act (favourite, chat, sell) — fewer taps to value.']
  ],'Today: 4 hard-coded splash screens (/splash-1…4) before the user sees anything sellable.']};

S.login={tab:null,html:`
  <div class="appbar"><div class="icn" onclick="go('splash')">‹</div><div class="t">Log in</div></div>
  <div class="pad">
    <div class="h" style="font-size:18px;margin-top:8px">Enter your number</div>
    <div class="sub" style="margin-bottom:18px">We’ll text a 6-digit code. No password to remember.</div>
    ${badge(150,20,1)}
    <div class="field row between"><span>🇮🇳 +91  |  98765 43210</span></div>
    <button class="btn" onclick="go('otp')">Send code</button>
    <div style="text-align:center;margin:18px 0" class="sub">or</div>
    ${badge(360,20,2)}
    <button class="btn ghost row" onclick="go('otp')"><span>✉️</span> Continue with email</button>
    <div style="height:10px"></div>
    <button class="btn ghost row" onclick="go('home')"><span>G</span> Continue with Google</button>
    <div class="hint">By continuing you agree to Terms & Privacy.</div>
  </div>`,
  notes:['login','Login',[
   [1,'Phone-first, password-free','OTP as the default path removes the password field, reset flow and a whole error surface.'],
   [2,'Email + social as one tap','Unifies the separate /login and /login-otp routes into one screen with method toggles.']
  ],'Today: login + OTP login live on different routes with platform-specific files (android/ios variants).']};

S.otp={tab:null,html:`
  <div class="appbar"><div class="icn" onclick="go('login')">‹</div><div class="t">Verify</div></div>
  <div class="pad">
    <div class="h" style="font-size:18px;margin-top:8px">Enter the 6-digit code</div>
    <div class="sub">Sent to +91 98765 43210 · <span style="color:${A}">Change</span></div>
    ${badge(150,20,1)}
    <div class="row" style="gap:8px;margin:22px 0;justify-content:space-between">
      ${[1,2,3,4,5,6].map((n,i)=>`<div class="field" style="width:40px;text-align:center;margin:0;${i<3?'border-color:var(--accent);color:var(--ink)':''}">${i<3?'•':''}</div>`).join('')}
    </div>
    ${badge(300,20,2)}
    <div class="sub">Auto-detecting SMS… <span style="color:var(--accent2)">●</span></div>
    <div style="height:14px"></div>
    <button class="btn" onclick="go('home')">Verify & continue</button>
    <div class="hint">Resend code in 0:24</div>
  </div>`,
  notes:['otp','OTP verification',[
   [1,'Single-tap boxes + paste','Big touch targets, auto-advance between boxes.'],
   [2,'SMS auto-read','Auto-fill the code from the incoming SMS so most users tap nothing — the fastest possible verify.']
  ],'Today: manual entry, no auto-read, generic single field.']};

S.signup={tab:null,html:`
  <div class="appbar"><div class="icn" onclick="go('login')">‹</div><div class="t">Create account</div></div>
  <div class="pad">
    ${badge(60,20,1)}
    <div class="sub" style="margin:6px 0 14px">Step 2 of 2 · just the essentials</div>
    <div class="field">Full name</div>
    <div class="field">Email (optional)</div>
    <div class="field row between"><span>📍 Bengaluru, KA</span><span style="color:${A}">Detect</span></div>
    ${badge(300,20,2)}
    <div class="tile" style="margin:6px 0 14px"><div class="sub">Profile photo — optional, add later</div></div>
    <button class="btn" onclick="go('home')">Finish & explore</button>
    <div class="hint">You can complete the rest from Profile anytime.</div>
  </div>`,
  notes:['signup','Sign up',[
   [1,'Progressive profiling','Only name + city required at signup; everything else deferred. Drops a long form to 2 fields.'],
   [2,'Defer the optional','Photo, bio, password etc. moved to Profile so nothing blocks the first sell/contact.']
  ],'Today: signup is a full single-page form with android/ios duplicates.']};

S.home={tab:'home',html:`
  <div class="appbar">
    <div class="icn">📍</div>
    <div style="flex:1"><div style="font-size:11px;color:var(--muted)">Location</div><div style="font-size:13px;font-weight:700">Bengaluru ▾</div></div>
    <div class="icn" onclick="go('chat')">💬</div><div class="icn">🔔</div>
  </div>
  <div class="pad" style="padding-bottom:6px">
    <div class="search" onclick="go('search')">⌕ Search cars, bikes, property…</div>
  </div>
  ${badge(140,150,1)}
  <div class="pad" style="padding-top:8px">
    <div class="scrollx">
      ${[['🚗','Cars'],['🏍️','Bikes'],['🚚','Commercial'],['🏠','Property'],['🏢','Showroom']].map(([i,l])=>`<div class="cat" onclick="go('category')"><div class="ic">${i}</div><span>${l}</span></div>`).join('')}
    </div>
  </div>
  ${badge(255,12,2)}
  <div class="pad" style="padding-top:6px"><div class="hero" style="height:120px;border-radius:14px"><div class="dots"><i class="on"></i><i></i><i></i></div></div></div>
  <div class="pad row between" style="padding-bottom:4px"><div class="h">Fresh near you</div><div class="sub" style="color:${A}">See all</div></div>
  ${badge(470,12,3)}
  <div class="pad" style="padding-top:4px"><div class="grid2">${adcard('NEW')+adcard()+adcard('VERIFIED')+adcard()}</div></div>
  <div class="pad" style="padding-top:0"><div class="grid2">${'<div class="adcard"><div class="img skel"></div><div class="b"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:9px;margin-top:6px"></div></div></div>'.repeat(2)}</div></div>
  `,
  notes:['home','Home',[
   [1,'Sticky search + horizontal categories','Search bar and category rail pinned at the top — discovery is reachable in one thumb-move, no scroll.'],
   [2,'Auto-rotating promo + location chip','Location and personalised feed front-and-centre; promo banner is one slim carousel, not a tall block.'],
   [3,'2-up card grid w/ skeletons','Denser scannable grid (was a single column). Skeletons paint instantly while data streams in — feels fast.']
  ],'Today: home_page.dart is ~1,830 lines, single-column list, separate android/ios home files, no skeletons.']};

S.category={tab:'home',html:`
  <div class="appbar"><div class="icn" onclick="go('home')">‹</div><div class="t">Cars in Bengaluru</div><div style="flex:1"></div><div class="icn" onclick="go('search')">⌕</div></div>
  ${badge(58,12,1)}
  <div class="pad" style="padding:10px 14px"><div class="scrollx">
    <div class="chip icon on" onclick="go('search')">⚙ Filters</div>
    <div class="chip">Sort ▾</div><div class="chip">Under ₹5L</div><div class="chip">Petrol</div><div class="chip">Automatic</div><div class="chip">≤50k km</div>
  </div></div>
  ${badge(108,250,2)}
  <div class="pad row between" style="padding:2px 14px"><div class="sub">248 results</div><div class="sub">⊞ Grid · ☰</div></div>
  <div class="pad" style="padding-top:8px"><div class="grid2">${adcard('NEW')+adcard()+adcard()+adcard('VERIFIED')+adcard()+adcard()}</div></div>`,
  notes:['category','Category list',[
   [1,'Quick-filter chip rail','Most-used filters (price, fuel, transmission, km) as one-tap chips before opening the full filter sheet — fewer taps to narrow.'],
   [2,'Result count + grid/list toggle','Instant feedback on how many match; user controls density.']
  ],'Today: category_list_page renders a plain list; filters are a separate full page round-trip.']};

S.search={tab:'search',html:`
  <div class="appbar"><div class="icn" onclick="go('home')">‹</div>
    <div class="search" style="background:var(--card)">⌕ Swift, Activa, 2BHK…</div></div>
  ${badge(70,14,1)}
  <div class="pad">
    <div class="sub" style="margin-bottom:8px">RECENT</div>
    <div class="scrollx" style="margin-bottom:14px">${['Swift VXI','Royal Enfield','2BHK rent','Bolero'].map(c=>`<div class="chip icon">🕘 ${c}</div>`).join('')}</div>
    <div class="sub" style="margin-bottom:8px">TRENDING NOW</div>
    <div class="row wrap" style="gap:8px;margin-bottom:18px">${['Creta','Pulsar 150','Tata Ace','Plots','Scorpio','iPhone'].map(c=>`<div class="chip">🔥 ${c}</div>`).join('')}</div>
  </div>
  ${badge(330,14,2)}
  <div class="tile" style="margin:0 14px;border-style:dashed"><div class="row between"><div><div class="h" style="margin:0">🔔 Save this search</div><div class="sub">Get alerts when new matches are posted</div></div><div style="color:${A}">＋</div></div></div>
  <div style="height:14px"></div>`,

/* ---------- render ---------- */
function go(id){
  if(!S[id])return;
  const s=S[id];
  document.getElementById('view').innerHTML=s.html;
  document.getElementById('view').scrollTop=0;
  document.getElementById('tabbar').innerHTML=s.tab!==undefined?tabbar(s.tab):'';
  // notes
  const[code,title,notes,before]=s.notes;
  document.getElementById('notes').innerHTML=
    `<div class="scr-name">Screen · ${title}</div>
     <h3>What makes it faster</h3>`+
     notes.map(([n,h,d])=>`<div class="note"><div class="n">${n}</div><div><b>${h}</b><br><span>${d}</span></div></div>`).join('')+
     (before?`<div class="before"><b>⟳ Current state — </b>${before}</div>`:'');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));
go('home');
</script>
